version: "3.8"

services:
  vitqa:
    build: .
    container_name: vitqa
    restart: unless-stopped
    ports:
      - "5005:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-vitqa-jwt-secret-prod-2026}
      - USDT_WALLET=${USDT_WALLET:-TXYZ1234567890AbCdEfGhIjKlMnOpQrStUvWxYz}
    volumes:
      - vitqa_data:/app/backend/uploads
      - vitqa_outputs:/app/backend/outputs

volumes:
  vitqa_data:
  vitqa_outputs:
